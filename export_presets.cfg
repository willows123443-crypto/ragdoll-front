html/head_include="<script>\n// A limiter on everything the game plays: loud moments are squeezed under full scale, not clipped,\n// and the quiet parts of a battle come up with them.\n(function () {\n	if (!window.AudioNode || !window.DynamicsCompressorNode) { return; }\n	var real = AudioNode.prototype.connect;\n	var made = new WeakMap();\n	AudioNode.prototype.connect = function (dst) {\n		try {\n			if (dst && this.context && dst === this.context.destination && !(this instanceof DynamicsCompressorNode)) {\n				var c = made.get(this.context);\n				if (!c) {\n					c = this.context.createDynamicsCompressor();\n					c.threshold.value = -10; c.knee.value = 8; c.ratio.value = 14; c.attack.value = 0.002; c.release.value = 0.2;\n					real.call(c, this.context.destination);\n					made.set(this.context, c);\n				}\n				var a = Array.prototype.slice.call(arguments);\n				a[0] = c;\n				return real.apply(this, a);\n			}\n		} catch (e) {}\n		return real.apply(this, arguments);\n	};\n})();\n</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
